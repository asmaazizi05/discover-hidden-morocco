<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Hidden Morocco | Links</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #D4AF37;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #2C3E50;
        }
        p {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            background-color: #ffffff;
            color: #2C3E50;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .link-btn:hover {
            background-color: #D4AF37;
            color: #ffffff;
            border-color: #D4AF37;
            transform: translateY(-2px);
        }
        .primary-btn {
            background-color: #2C3E50;
            color: #ffffff;
            border-color: #2C3E50;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Remplace logo.png par le nom exact de ton fichier logo -->
        <img src="https://discoverhiddenmorocco.com/images/logo.png" alt="Discover Hidden Morocco" class="profile-img">
        
        <h1>Discover Hidden Morocco</h1>
        <p>Explore the magic of Morocco, from golden dunes to ancient kasbahs. 🇲🇦</p>

        <!-- Liste des liens modifiée en anglais -->
        <a href="https://discoverhiddenmorocco.com/tours" class="link-btn primary-btn">Book Your Desert Tour Now</a>
        
        <a href="https://youtube.com/channel/..." class="link-btn" target="_blank">Watch Our Latest YouTube Vlogs</a>
        
        <a href="https://www.tripadvisor.com/..." class="link-btn" target="_blank">Read Our TripAdvisor Reviews</a>
        
        <a href="mailto:contact@discoverhiddenmorocco.com" class="link-btn">Contact Us for Custom Itineraries</a>
    </div>

</body>
</html>
