<!DOCTYPE html>
<html lang="en" data-theme="dark" style="background-color:#151515;color-scheme:dark;">

<head>
  <base href="/">
  <!-- Instant Cache-Busting & Legacy Service Worker Purger -->
  <script>
    (function() {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>404 — Page Not Found | Discover Hidden Morocco</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css?v=20261026_v41">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    // Safe non-looping path normalizer
    (function() {
      try {
        var path = window.location.pathname.toLowerCase();
        // Redirect legacy /testimonials to /reviews
        if (path.includes('testimonials')) {
          window.location.replace('/reviews');
          return;
        }
      } catch (e) {}
    })();
  </script>
</head>

<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--hm-bg-main, #151515); color: var(--hm-text-heading, #fff); font-family: 'Open Sans', Arial, sans-serif; margin: 0; padding: 24px; box-sizing: border-box; text-align: center;">

    <span style="display: inline-block; padding: 6px 18px; border-radius: 99px; background: rgba(200, 90, 50, 0.2); color: #E7A93C; font-size: 0.85rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px;">
      ✦ 404 — PAGE NOT FOUND ✦

    <p style="font-size: 1.05rem; color: #94A3B8; line-height: 1.7; margin: 0 auto 32px auto; max-width: 440px; text-align: center !important;">
      The expedition route you are looking for does not exist or may have been relocated. Let's get you back on track.
    </p>

      <a href="/" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 99px; background: linear-gradient(135deg, #C85A32, #E7A93C); color: #FFFFFF; font-weight: 700; font-size: 0.95rem; text-decoration: none; transition: transform 0.2s;">
        <i class="fa-solid fa-house"></i> Return Home
