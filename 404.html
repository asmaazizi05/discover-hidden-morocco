<!DOCTYPE html>
<html lang="en" data-theme="dark" style="background-color:#151515;color-scheme:dark;">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
  (function () {
    try {
      var origin = window.location.origin || (window.location.protocol + '//' + window.location.host);
      var path = window.location.pathname || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var clean = path.replace(/\/+$/, '').replace(/^\/+/, '');
      if (clean.toLowerCase().includes('testimonials')) clean = 'reviews';
      if (clean && !clean.endsWith('.html')) {
        window.location.replace(origin + '/' + clean + '.html' + search + hash);
        return;
      }
    } catch (e) {}
    window.location.replace(origin + '/index.html');
  })();
</script>
